spring.application.name=pcb_manage
spring.config.import=optional:file:../../service-config.properties
server.port=${SERVER_PORT:${mes.port:8080}}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pcb_aoi}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.security.jwt-secret=${JWT_SECRET:local-development-secret-change-before-production-2026}
app.security.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.security.station-key=${STATION_KEY:local-station-key-change-before-production}

app.recipe-draft.url=${RECIPE_DRAFT_URL:http://${python.host:172.20.10.4}:${python.port:8001}}
app.recipe-draft.path=${RECIPE_DRAFT_PATH:${python.recipe-draft-path:/recipe-draft}}
app.recipe-draft.timeout-seconds=${RECIPE_DRAFT_TIMEOUT_SECONDS:${python.timeout-seconds:120}}
app.recipe-draft.sample-fallback-enabled=${RECIPE_DRAFT_SAMPLE_FALLBACK:false}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
