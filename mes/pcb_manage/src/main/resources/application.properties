spring.application.name=pcb_manage
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pcb_aoi}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.security.jwt-secret=${JWT_SECRET:local-development-secret-change-before-production-2026}
app.security.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
